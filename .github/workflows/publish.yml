name: Publish Wellspring

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Get mod version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)

          echo "Publishing Wellspring $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      - name: Publish
        uses: Kira-NT/mc-publish@v3
        with:
          name: "Wellspring ${{ steps.version.outputs.version }}"
          version: "${{ steps.version.outputs.version }}"

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          changelog-file: CHANGELOG.md

          loaders: |
            neoforge

          game-versions: |
            26.1.2

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: "v${{ steps.version.outputs.version }}"
          github-commitish: "${{ github.sha }}"